# XcodeGen spec — optional. Only needed if you install full Xcode and want
# `xcodebuild` to take over from the swiftc fallback in build.sh.
# Usage: brew install xcodegen && xcodegen generate
name: OmniTracker
options:
  bundleIdPrefix: com.omnitracker
  deploymentTarget:
    macOS: "14.0"
targets:
  OmniTracker:
    type: application
    platform: macOS
    sources:
      - path: Sources/OmniTracker
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.omnitracker.app
        INFOPLIST_FILE: Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Resources/OmniTracker.entitlements
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGNING_REQUIRED: NO
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_VERSION: "6.0"
