# XcodeGen spec — optional. Only needed if you install full Xcode and want
# `xcodebuild` to take over from the swiftc fallback in build.sh.
# Usage: brew install xcodegen && xcodegen generate
name: macsync
options:
  bundleIdPrefix: com.macsync
  deploymentTarget:
    macOS: "14.0"
targets:
  macsync:
    type: application
    platform: macOS
    sources:
      - path: Sources/macsync
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.macsync.app
        INFOPLIST_FILE: Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Resources/macsync.entitlements
        CODE_SIGN_IDENTITY: "macsync-dev"
        CODE_SIGNING_REQUIRED: NO
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_VERSION: "6.0"
