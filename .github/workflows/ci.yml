name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Run unit tests
        run: ./test.sh
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Build app + dmg
        run: ./build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: macsync-dmg
          path: build/macsync.dmg
